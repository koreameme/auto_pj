# Site Settings
title: "Top10shop"
tagline: "데이터 기반 스마트 쇼핑 가이드"
description: "수만 건의 실구매 후기와 가격 데이터를 분석해 가성비 TOP 상품만 엄선했습니다. 잘못된 선택으로 낭비하는 시간과 비용, 이제 그만."
url: "https://koreameme.github.io"
baseurl: "/auto_pj"

# Authors
authors:
  admin:
    name: "Top10shop"
    display_name: "Top10shop Admin"
    avatar: "/assets/images/logo.png"
    web: "https://koreameme.github.io/auto_pj"
    description: "AI를 활용하여 사용자 후기와 데이터를 분석, 가장 신뢰할 수 있는 베스트 10 상품을 추천합니다."

# Permalinks
permalink: /:title/

# Pagination
paginate: 6
paginate_path: /page:num/

# Archives
jekyll-archives:
  enabled:
    - categories
    - tags
  layout: archive
  permalinks:
    category: /category/:name/
    tag: /tag/:name/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives

# Markdown Configuration
markdown: kramdown
highlighter: rouge

# Excludes (Jekyll 빌드에서 파이썬 관련 파일 제외)
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - venv/
  - .env
  - .env.template
  - main.py
  - keyword_analyzer.py
  - coupang_partner.py
  - content_writer.py
  - requirements.txt
  - test_posts/
  - .git/
  - .github/
