name: Auto Revenue Blog Publisher

on:
  schedule:
    # 한국 표준시(KST) = UTC + 9
    - cron: '0 22 * * *'   # 07:00 KST (건강)
    - cron: '0 0 * * *'    # 09:00 KST (건강)
    - cron: '30 1 * * *'   # 10:30 KST (건강)
    - cron: '30 2 * * *'   # 11:30 KST (건강)
    - cron: '0 3 * * *'    # 12:00 KST (AI 뉴스)
    - cron: '0 4 * * *'    # 13:00 KST (최신 이슈)
    - cron: '30 5 * * *'   # 14:30 KST (AI 뉴스)
    - cron: '0 7 * * *'    # 16:00 KST (최신 이슈)
    - cron: '30 8 * * *'   # 17:30 KST (AI 뉴스)
    - cron: '30 9 * * *'   # 18:30 KST (최신 이슈)
    - cron: '30 10 * * *'  # 19:30 KST (AI 뉴스)
    - cron: '0 11 * * *'   # 20:00 KST (최신 이슈)
    - cron: '0 12 * * *'   # 21:00 KST (건강)
    - cron: '30 13 * * *'  # 22:30 KST (최신 이슈)
  workflow_dispatch:
    inputs:
      category:
        description: '발행할 포스팅 카테고리 (auto, health, ai_news, latest_issue)'
        required: true
        default: 'auto'

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-publish
      cancel-in-progress: false  # 큐에 넣어서 순차 실행 (취소 X)
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 전체 히스토리 가져오기 (rebase 충돌 방지)

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Auto Publisher Pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          python main.py --category "${{ github.event.inputs.category || 'auto' }}"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/ assets/images/posts/
          if ! git diff --cached --quiet; then
            git commit -m "feat: Auto-published blog post via GitHub Actions"
            # 원격 변경사항을 rebase로 병합 후 push (동시 실행 충돌 방지)
            git pull --rebase origin master
            git push origin master
          else
            echo "No new posts generated."
          fi
